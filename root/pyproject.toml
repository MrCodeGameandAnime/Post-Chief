[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "post-chief"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "alembic>=1.14,<2", "pydantic-settings>=2,<3", "httpx>=0.28,<1", "cryptography>=44", "pyjwt>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "celery>=5.4,<6", "redis>=5,<9", "python-multipart>=0.0.20", "pillow>=11,<14", "regex>=2024"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
where = ["src/apps/api", "src/apps/worker", "src/packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/apps/api", "src/apps/worker", "src/packages"]
asyncio_mode = "auto"
addopts = "--basetemp=.pytest-tmp"
