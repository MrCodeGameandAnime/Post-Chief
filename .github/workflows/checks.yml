name: Application checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postchief_test
          POSTGRES_USER: postchief
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postchief -d postchief_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: root
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: root/requirements.lock
      - name: Install locked dependencies and application
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
          python -m pip check
      - name: Test SQLite API and provider contracts
        if: matrix.database == 'sqlite'
        run: python -m pytest -q --junitxml=test-results/api-sqlite.xml
      - name: Test PostgreSQL API and provider contracts
        if: matrix.database == 'postgres'
        run: python -m pytest -q --junitxml=test-results/api-postgres.xml
        env:
          POST_CHIEF_TEST_DATABASE_URL: postgresql+psycopg://postchief:ci-only-password@localhost:5432/postchief_test
      - name: Check SQLite migrations
        if: matrix.database == 'sqlite'
        run: |
          mkdir -p data
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
        env:
          DATABASE_URL: sqlite:///data/ci.db
      - name: Check PostgreSQL migrations
        if: matrix.database == 'postgres'
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://postchief:ci-only-password@localhost:5432/postchief_test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: api-results-${{ matrix.database }}
          path: root/test-results/*.xml
          if-no-files-found: warn
          retention-days: 7

  web:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: root
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: root/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  container:
    name: Container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: root
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Generate ephemeral configuration
        run: |
          python - <<'PY'
          import base64
          import secrets
          from pathlib import Path
          Path('.env').write_text('\n'.join([
              'SIGNING_KEY='+secrets.token_urlsafe(48),
              'ENCRYPTION_KEY='+base64.urlsafe_b64encode(secrets.token_bytes(32)).decode(),
              'POSTGRES_PASSWORD='+secrets.token_hex(24),
              'BOOTSTRAP_EMAIL=ci@example.test',
              'BOOTSTRAP_PASSWORD='+secrets.token_urlsafe(32),
          ])+'\n')
          PY
      - name: Build, migrate and start API
        run: docker compose up -d --build --wait --wait-timeout 120 api
      - name: Verify database-backed health
        run: |
          for attempt in $(seq 1 30); do
            echo "API readiness attempt $attempt"
            if curl --fail --silent http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
